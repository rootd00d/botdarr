# botdarr CI: test + package on every branch/MR, docker image to the GitLab
# registry on development (test images), and to Docker Hub on tag pushes (releases).
#
# Required CI/CD variables (Settings -> CI/CD -> Variables):
#   DOCKERHUB_USER  - docker hub username (rootd00d)
#   DOCKERHUB_TOKEN - docker hub access token (Read & Write), masked
#
# GitLab registry credentials (CI_REGISTRY, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD)
# are predefined by GitLab and need no configuration.

stages:
  - test
  - package
  - docker

variables:
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository"

.maven:
  image: maven:3.8-openjdk-8
  cache:
    key: maven-jdk8
    paths:
      - .m2/repository

test:
  extends: .maven
  stage: test
  script:
    - mvn ${MAVEN_CLI_OPTS} test

package:
  extends: .maven
  stage: package
  script:
    - mvn ${MAVEN_CLI_OPTS} package -DskipTests
  artifacts:
    paths:
      - target/botdarr-release.jar
    expire_in: 1 week

# kaniko builds images without a docker daemon, so the runner needs no
# privileged mode / dind service (our runner is unprivileged).
.docker:
  stage: docker
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  dependencies:
    - package

# test images: every push to development lands in the project's GitLab registry
docker-test:
  extends: .docker
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --cache=true --cache-repo="${CI_REGISTRY_IMAGE}/cache" --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" --destination "${CI_REGISTRY_IMAGE}:testing"

# releases: push a tag (e.g. 5.6.24) to publish rootd00d/botdarr on Docker Hub
docker-release:
  extends: .docker
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(printf "%s:%s" "${DOCKERHUB_USER}" "${DOCKERHUB_TOKEN}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --cache=true --cache-repo="${CI_REGISTRY_IMAGE}/cache" --destination "${DOCKERHUB_USER}/botdarr:${CI_COMMIT_TAG}" --destination "${DOCKERHUB_USER}/botdarr:latest"
